spring.application.name=medication-reminder
spring.application.version=1.0.0
spring.application.description=application de rappel de prise de medicament

# Base de données - utilise la variable d'environnement de Render
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medication_db}
spring.datasource.username=${DB_USERNAME:adm_test-api}
spring.datasource.password=${DB_PASSWORD:test@api}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Port dynamique pour Render
server.port=${PORT:8080}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api
springdoc.swagger-ui.disable-swagger-default-url=true
